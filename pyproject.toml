[project]
name = "mlops-lab-1"
version = "0.1.0"
description = "MLOps Labs - Food-11 data versioning, training and MLflow tracking"
readme = "README.md"
authors = [
    { name = "ayaelkhalil1015", email = "ayaelkhalil1015@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "mlflow>=3.16.0",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "uvicorn>=0.53.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "food11"

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
]
